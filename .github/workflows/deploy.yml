name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/bean-annotator
            git pull origin main
            if [ -d "venv" ]; then
              source venv/bin/activate
              VENV_PYTHON="venv/bin/python"
            elif [ -d ".venv" ]; then
              source .venv/bin/activate
              VENV_PYTHON=".venv/bin/python"
            else
              python3 -m venv venv
              source venv/bin/activate
              VENV_PYTHON="venv/bin/python"
            fi
            pip install -r requirements.txt --quiet
            mkdir -p logs
            (crontab -l 2>/dev/null | grep -v 'assign_skipped_redo_to_lovepreet.py' || true; echo "0 2 * * * cd /opt/bean-annotator && $VENV_PYTHON scripts/assign_skipped_redo_to_lovepreet.py --execute >> logs/skipped_redo_lovepreet.log 2>&1") | crontab -
            sudo systemctl restart bean-annotator bean-admin
            echo "Deploy complete: $(date)"
